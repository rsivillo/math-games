<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCS Histogram Challenge</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .game {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
    }

    h1 {
      text-align: center;
    }

    .top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
    }

    .histogram-wrap {
      background: #eef2f7;
      border-radius: 12px;
      padding: 15px;
    }

    svg {
      width: 100%;
      height: auto;
    }

    .question {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-top: 25px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .choice {
      border: 2px solid #bbb;
      background: white;
      border-radius: 10px;
      padding: 15px;
      font-size: 17px;
      cursor: pointer;
    }

    .choice:hover {
      background: #eef2ff;
    }

    .choice:disabled {
      cursor: default;
    }

    .correct-choice {
      border-color: #2563eb;
      background: #dbeafe;
      font-weight: bold;
    }

    #feedback {
      min-height: 55px;
      margin-top: 20px;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      border-radius: 10px;
    }

    #nextButton,
    #playAgain {
      display: block;
      margin: 15px auto 0;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      font-size: 17px;
      cursor: pointer;
    }

    #nextButton {
      display: none;
    }

    .reminder {
      margin-top: 25px;
      background: #f8fafc;
      border-radius: 10px;
      padding: 15px;
    }

    .reminder strong {
      color: #1d4ed8;
    }

    #results {
      display: none;
      text-align: center;
    }

    #finalScore {
      font-size: 42px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="game">

  <div id="gameScreen">

    <h1>SOCS Histogram Challenge</h1>

    <div class="top">
      <div>
        <div id="progress">Question 1 of 10</div>
        <div id="category">Shape</div>
      </div>

      <div class="score">
        Score: <span id="score">0</span>
      </div>
    </div>

    <div class="histogram-wrap">
      <svg id="histogram" viewBox="0 0 640 320"></svg>
    </div>

    <div id="question" class="question"></div>

    <div id="choices" class="choices"></div>

    <div id="feedback"></div>

    <button id="nextButton">Next Question</button>

    <div class="reminder">
      <strong>S</strong> — Shape<br>
      <strong>O</strong> — Outliers<br>
      <strong>C</strong> — Center<br>
      <strong>S</strong> — Spread
    </div>

  </div>

  <div id="results">

    <h1>Game Complete!</h1>

    <p>Your final score:</p>

    <div id="finalScore">0 / 100</div>

    <p id="finalMessage"></p>

    <button id="playAgain">Generate New Game</button>

  </div>

</div>

<script>

let questions = [];
let currentQuestion = 0;
let score = 0;
let correct = 0;
let answered = false;

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function choice(array) {
  return array[randInt(0, array.length - 1)];
}

function shuffle(array) {

  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {

    const j = randInt(0, i);

    [copy[i], copy[j]] =
      [copy[j], copy[i]];
  }

  return copy;
}

function jitter(value, amount = 2) {
  return Math.max(
    0,
    value + randInt(-amount, amount)
  );
}

function makeSymmetric() {

  const half = [
    randInt(1,3),
    randInt(3,5),
    randInt(5,8),
    randInt(8,12),
    randInt(11,15)
  ];

  const bars = [
    ...half,
    randInt(13,17),
    ...half.slice().reverse()
  ];

  return bars.map(v => jitter(v,1));
}

function makeRightSkew() {

  const peak = randInt(11,15);

  const raw = [
    peak,
    peak - 1,
    peak - 3,
    peak - 5,
    peak - 7,
    peak - 8,
    peak - 9,
    2,
    1
  ];

  return raw.map(
    v => jitter(Math.max(1,v),1)
  );
}

function makeLeftSkew() {
  return makeRightSkew().reverse();
}

function makeUniform() {

  const base = randInt(6,10);

  return Array.from(
    {length:9},
    () => jitter(base,1)
  );
}

function makeOutlier(high = true) {

  const main =
    makeSymmetric().slice(1,8);

  if (high) {
    return [
      ...main,
      0,
      0,
      randInt(1,2)
    ];
  }

  return [
    randInt(1,2),
    0,
    0,
    ...main
  ];
}

function makeNoOutlier() {

  return choice([
    makeSymmetric(),
    makeRightSkew(),
    makeLeftSkew(),
    makeUniform()
  ]);
}

function shapeQuestion() {

  const shape =
    choice([
      "symmetric",
      "right",
      "left",
      "uniform"
    ]);

  let bars;
  let answer;
  let explanation;

  if (shape === "symmetric") {

    bars = makeSymmetric();

    answer =
      "Approximately symmetric";

    explanation =
      "The distribution rises toward the middle and falls in a similar pattern on both sides.";

  } else if (shape === "right") {

    bars = makeRightSkew();

    answer =
      "Skewed right";

    explanation =
      "Most observations are on the left and the tail extends toward larger values.";

  } else if (shape === "left") {

    bars = makeLeftSkew();

    answer =
      "Skewed left";

    explanation =
      "Most observations are on the right and the tail extends toward smaller values.";

  } else {

    bars = makeUniform();

    answer =
      "Approximately uniform";

    explanation =
      "The bars are fairly similar in height across the distribution.";
  }

  const choices = shuffle([
    "Skewed left",
    "Skewed right",
    "Approximately symmetric",
    "Approximately uniform"
  ]);

  return {
    category: "Shape",
    bars: bars,
    question:
      "What is the best description of the shape?",
    choices: choices,
    answer:
      choices.indexOf(answer),
    explanation: explanation
  };
}

function centerQuestion() {

  const right =
    Math.random() < 0.5;

  const bars =
    right
    ? makeRightSkew()
    : makeLeftSkew();

  const answer =
    right ? "Mean" : "Median";

  const choices = shuffle([
    "Mean",
    "Median",
    "They should be approximately equal"
  ]);

  const explanation =
    right
    ? "The long right tail pulls the mean upward, so the mean is usually greater than the median."
    : "The long left tail pulls the mean downward, so the median is usually greater than the mean.";

  return {
    category: "Center",
    bars: bars,
    question:
      "Which measure of center is probably larger?",
    choices: choices,
    answer:
      choices.indexOf(answer),
    explanation: explanation
  };
}

function symmetricCenterQuestion() {

  const bars =
    makeSymmetric();

  const choices = shuffle([
    "Mean",
    "Median",
    "They should be approximately equal"
  ]);

  return {
    category: "Center",
    bars: bars,
    question:
      "For this approximately symmetric distribution, how should the mean and median compare?",
    choices: choices,
    answer:
      choices.indexOf(
        "They should be approximately equal"
      ),
    explanation:
      "For an approximately symmetric distribution, the mean and median are usually close together."
  };
}

function outlierQuestion() {

  const hasOutlier =
    Math.random() < 0.55;

  const high =
    Math.random() < 0.5;

  const bars =
    hasOutlier
    ? makeOutlier(high)
    : makeNoOutlier();

  return {
    category: "Outliers",
    bars: bars,
    question:
      "Does this histogram appear to contain an obvious possible outlier?",
    choices: [
      "Yes",
      "No"
    ],
    answer:
      hasOutlier ? 0 : 1,
    explanation:
      hasOutlier
      ? "A small isolated bar is separated from the main cluster, suggesting a possible outlier."
      : "There is no clearly isolated bar separated from the rest of the distribution."
  };
}

function spreadQuestion() {

  const type =
    choice([
      "range",
      "iqr",
      "resistant"
    ]);

  const bars =
    makeNoOutlier();

  if (type === "range") {

    const choices = shuffle([
      "Range",
      "Mean",
      "Median",
      "Mode"
    ]);

    return {
      category: "Spread",
      bars: bars,
      question:
        "Which statistic measures the distance from the minimum to the maximum?",
      choices: choices,
      answer:
        choices.indexOf("Range"),
      explanation:
        "The range equals maximum minus minimum."
    };
  }

  if (type === "iqr") {

    const choices = shuffle([
      "IQR",
      "Range",
      "Mean",
      "Maximum"
    ]);

    return {
      category: "Spread",
      bars: bars,
      question:
        "Which statistic measures the spread of the middle 50% of the data?",
      choices: choices,
      answer:
        choices.indexOf("IQR"),
      explanation:
        "The IQR is Q3 − Q1, so it describes the spread of the middle 50%."
    };
  }

  const choices = shuffle([
    "IQR",
    "Range",
    "Mean",
    "Maximum"
  ]);

  return {
    category: "Spread",
    bars: bars,
    question:
      "Which measure of spread is resistant to extreme values?",
    choices: choices,
    answer:
      choices.indexOf("IQR"),
    explanation:
      "The IQR depends on the middle 50% of the data, so extreme values have little effect on it."
  };
}

function socsQuestion() {

  const type =
    choice([
      "right",
      "left",
      "symmetric",
      "outlier"
    ]);

  let bars;
  let correctText;
  let explanation;

  if (type === "right") {

    bars = makeRightSkew();

    correctText =
      "Skewed right, no obvious outliers, center toward the lower values, fairly wide spread";

    explanation =
      "The distribution has a long right tail, no isolated bar, and most observations are concentrated toward the lower values.";

  } else if (type === "left") {

    bars = makeLeftSkew();

    correctText =
      "Skewed left, no obvious outliers, center toward the higher values, fairly wide spread";

    explanation =
      "The distribution has a long left tail, no isolated bar, and most observations are concentrated toward the higher values.";

  } else if (type === "symmetric") {

    bars = makeSymmetric();

    correctText =
      "Approximately symmetric, no obvious outliers, center near the middle, moderate spread";

    explanation =
      "The two sides are similar, there are no separated bars, and the distribution is centered near the middle.";

  } else {

    const high =
      Math.random() < 0.5;

    bars =
      makeOutlier(high);

    correctText =
      "One main cluster with a possible outlier and a noticeable gap";

    explanation =
      "The isolated bar is separated from the main cluster by a noticeable gap.";
  }

  const distractors = [
    "Approximately uniform with no outliers and very little spread",
    "Perfectly symmetric with no spread at all",
    "Bimodal with two equally strong peaks",
    "Skewed in the opposite direction"
  ];

  const choices =
    shuffle([
      correctText,
      ...shuffle(distractors).slice(0,3)
    ]);

  return {
    category: "SOCS",
    bars: bars,
    question:
      "Which description best matches this distribution?",
    choices: choices,
    answer:
      choices.indexOf(correctText),
    explanation: explanation
  };
}

function generateGame() {

  const makers = [
    shapeQuestion,
    shapeQuestion,
    shapeQuestion,
    centerQuestion,
    symmetricCenterQuestion,
    outlierQuestion,
    outlierQuestion,
    spreadQuestion,
    spreadQuestion,
    socsQuestion
  ];

  questions =
    shuffle(
      makers.map(fn => fn())
    );
}

function drawHistogram(bars) {

  const svg =
    document.getElementById("histogram");

  svg.innerHTML = "";

  const W = 640;
  const H = 320;

  const left = 55;
  const right = 20;
  const top = 20;
  const bottom = 50;

  const plotWidth =
    W - left - right;

  const plotHeight =
    H - top - bottom;

  const maxY =
    Math.max(...bars,1);

  const barWidth =
    plotWidth / bars.length;

  function makeLine(
    x1,
    y1,
    x2,
    y2,
    color,
    width
  ) {

    const line =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    line.setAttribute("x1",x1);
    line.setAttribute("y1",y1);
    line.setAttribute("x2",x2);
    line.setAttribute("y2",y2);
    line.setAttribute("stroke",color);
    line.setAttribute("stroke-width",width);

    svg.appendChild(line);
  }

  for (let i = 0; i <= 4; i++) {

    const y =
      top +
      plotHeight * i / 4;

    makeLine(
      left,
      y,
      W-right,
      y,
      "#ccc",
      1
    );
  }

  makeLine(
    left,
    top,
    left,
    H-bottom,
    "#222",
    2
  );

  makeLine(
    left,
    H-bottom,
    W-right,
    H-bottom,
    "#222",
    2
  );

  bars.forEach((value,i) => {

    if (value <= 0) {
      return;
    }

    const height =
      (value / maxY) *
      (plotHeight - 4);

    const rect =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );

    rect.setAttribute(
      "x",
      left + i * barWidth + 1
    );

    rect.setAttribute(
      "y",
      H-bottom-height
    );

    rect.setAttribute(
      "width",
      Math.max(
        1,
        barWidth - 2
      )
    );

    rect.setAttribute(
      "height",
      height
    );

    rect.setAttribute(
      "fill",
      "#9ca3af"
    );

    rect.setAttribute(
      "stroke",
      "#222"
    );

    svg.appendChild(rect);
  });

  const xLabel =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  xLabel.setAttribute(
    "x",
    left + plotWidth/2
  );

  xLabel.setAttribute(
    "y",
    H - 12
  );

  xLabel.setAttribute(
    "text-anchor",
    "middle"
  );

  xLabel.textContent =
    "Data Values";

  svg.appendChild(xLabel);

  const yLabel =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

  yLabel.setAttribute(
    "x",
    17
  );

  yLabel.setAttribute(
    "y",
    top + plotHeight/2
  );

  yLabel.setAttribute(
    "text-anchor",
    "middle"
  );

  yLabel.setAttribute(
    "transform",
    "rotate(-90 17 " +
    (top + plotHeight/2) +
    ")"
  );

  yLabel.textContent =
    "Frequency";

  svg.appendChild(yLabel);
}

function showQuestion() {

  answered = false;

  const item =
    questions[currentQuestion];

  document.getElementById(
    "progress"
  ).textContent =
    "Question " +
    (currentQuestion + 1) +
    " of 10";

  document.getElementById(
    "category"
  ).textContent =
    item.category;

  document.getElementById(
    "score"
  ).textContent =
    score;

  document.getElementById(
    "question"
  ).textContent =
    item.question;

  document.getElementById(
    "feedback"
  ).textContent = "";

  document.getElementById(
    "nextButton"
  ).style.display =
    "none";

  const choicesBox =
    document.getElementById(
      "choices"
    );

  choicesBox.innerHTML = "";

  drawHistogram(
    item.bars
  );

  item.choices.forEach(
    function(text,index) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "choice";

      button.textContent =
        text;

      button.addEventListener(
        "click",
        function() {

          chooseAnswer(
            index
          );
        }
      );

      choicesBox.appendChild(
        button
      );
    }
  );
}

function chooseAnswer(index) {

  if (answered) {
    return;
  }

  answered = true;

  const item =
    questions[currentQuestion];

  const buttons =
    document.querySelectorAll(
      ".choice"
    );

  buttons.forEach(
    function(button,i) {

      button.disabled = true;

      if (i === item.answer) {

        button.classList.add(
          "correct-choice"
        );
      }
    }
  );

  if (index === item.answer) {

    score += 10;

    correct++;

    document.getElementById(
      "score"
    ).textContent =
      score;

    document.getElementById(
      "feedback"
    ).textContent =
      "Correct! " +
      item.explanation;

  } else {

    document.getElementById(
      "feedback"
    ).textContent =
      "Not quite. " +
      item.explanation;
  }

  const nextButton =
    document.getElementById(
      "nextButton"
    );

  nextButton.textContent =
    currentQuestion === 9
    ? "See Results"
    : "Next Question";

  nextButton.style.display =
    "block";
}

function nextQuestion() {

  if (!answered) {
    return;
  }

  currentQuestion++;

  if (currentQuestion >= 10) {

    finishGame();

  } else {

    showQuestion();
  }
}

function finishGame() {

  document.getElementById(
    "gameScreen"
  ).style.display =
    "none";

  document.getElementById(
    "results"
  ).style.display =
    "block";

  document.getElementById(
    "finalScore"
  ).textContent =
    score + " / 100";

  let message;

  if (score >= 90) {

    message =
      "Excellent SOCS recognition!";

  } else if (score >= 70) {

    message =
      "Strong work. Review the explanations for the questions you missed.";

  } else if (score >= 50) {

    message =
      "You have the basics. Focus on skew direction, outliers, and resistant statistics.";

  } else {

    message =
      "Keep practicing. Start with shape, then look for outliers, then think about center and spread.";
  }

  document.getElementById(
    "finalMessage"
  ).textContent =
    "You answered " +
    correct +
    " of 10 correctly. " +
    message;
}

function restartGame() {

  currentQuestion = 0;
  score = 0;
  correct = 0;
  answered = false;

  generateGame();

  document.getElementById(
    "results"
  ).style.display =
    "none";

  document.getElementById(
    "gameScreen"
  ).style.display =
    "block";

  showQuestion();
}

document.getElementById(
  "nextButton"
).addEventListener(
  "click",
  nextQuestion
);

document.getElementById(
  "playAgain"
).addEventListener(
  "click",
  restartGame
);

generateGame();
showQuestion();

</script>

</body>
</html>
